<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracer Study — SALUT Admin</title>
<meta name="description" content="Rekapitulasi data Tracer Study alumni SALUT">
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/chart.umd.min.js"></script>
<script src="js/charts.js"></script>
</head>
<body>
<div id="toast-container"></div>
<div class="layout">
  <aside class="sidebar" aria-label="Navigasi utama">
    <div class="sidebar-logo">
      <img class="brand-mark" src="img/logo_salut.png" alt="">
      <div>
        <p class="brand-role" id="sidebar-role-label">Admin Panel</p>
        <span class="brand-sub">v1.0 • SMK 1 Teladan</span>
      </div>
    </div>
    <nav class="nav-section" id="sidebar-nav" aria-label="Menu"></nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <div class="user-name" id="nav-user-name">Memuat...</div>
          <div class="user-role" id="nav-user-role">peran</div>
        </div>
      </div>
      <button type="button" class="btn-logout" id="btn-logout"><svg class="icon" aria-hidden="true"><use href="#i-log-out"/></svg>Keluar</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 class="page-title">Tracer Study</h1><p class="page-sub">Rekapitulasi aktivitas alumni pasca-kelulusan</p></div>
    </header>
    <div class="content">
      <!-- Stat ringkas -->
      <dl class="card kpi-list kpi-list--4" aria-label="Ringkasan tracer study">
        <div class="kpi"><dt class="kpi-label">Total responden</dt><dd class="kpi-value" id="ts-total" data-count>—</dd></div>
        <div class="kpi"><dt class="kpi-label">Melanjutkan kuliah</dt><dd class="kpi-value" id="ts-kuliah" data-count>—</dd></div>
        <div class="kpi"><dt class="kpi-label">Bekerja</dt><dd class="kpi-value" id="ts-kerja" data-count>—</dd></div>
        <div class="kpi"><dt class="kpi-label">Wirausaha</dt><dd class="kpi-value" id="ts-wirausaha" data-count>—</dd></div>
      </dl>

      <!-- Filter -->
      <div class="toolbar">
        <select class="form-input form-select" id="filter-angkatan" aria-label="Filter angkatan" onchange="loadTracer()">
          <option value="">Semua Angkatan</option>
          <option value="2024">Angkatan 2024</option>
          <option value="2025">Angkatan 2025</option>
          <option value="2026">Angkatan 2026</option>
        </select>
        <select class="form-input form-select" id="filter-status" aria-label="Filter status" onchange="loadTracer()">
          <option value="">Semua Status</option>
          <option value="Bekerja">Bekerja</option>
          <option value="Kuliah / Melanjutkan Studi">Kuliah</option>
          <option value="Wirausaha">Wirausaha</option>
        </select>
        <button type="button" class="btn btn-ghost toolbar-end" onclick="exportTracerCsv()" id="btn-export-csv"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Export CSV</button>
      </div>

      <!-- Charts -->
      <div class="charts-grid">
        <section class="card">
          <div class="card-head"><h3 class="card-title">Distribusi status alumni</h3><p class="card-sub">Berdasarkan data tracer study yang masuk</p></div>
          <div class="chart-box"><canvas id="chart-status" role="img" aria-label="Diagram distribusi status alumni"></canvas></div>
        </section>
        <section class="card">
          <div class="card-head"><h3 class="card-title">Per angkatan</h3><p class="card-sub">Jumlah responden per tahun kelulusan</p></div>
          <div class="chart-box"><canvas id="chart-angkatan" role="img" aria-label="Diagram jumlah responden per angkatan"></canvas></div>
        </section>
      </div>

      <div id="table-content" class="section-gap"></div>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.12/dist/motion.js"></script>
<script src="js/motion.js"></script>
<script>
Auth.guard();
Auth.buildNav('tracer');
const currentUser = Auth.user();
const isAdmin = currentUser && currentUser.role === 'admin';

async function loadTracer() {
  document.getElementById('table-content').innerHTML = UI.loading();
  var angkatan = document.getElementById('filter-angkatan').value;
  var status   = document.getElementById('filter-status').value;
  var params   = new URLSearchParams({ per_page: 100 });
  if (angkatan) params.set('angkatan', angkatan);
  if (status)   params.set('status', status);

  try {
    var res = await Api.get('/admin/tracer-studies?' + params.toString());
    var s   = res.summary;
    document.getElementById('ts-total').textContent    = s.total;
    document.getElementById('ts-kuliah').textContent   = s.kuliah;
    document.getElementById('ts-kerja').textContent    = s.bekerja;
    document.getElementById('ts-wirausaha').textContent= s.wirausaha;

    renderCharts(res.data.data);
    renderTable(res.data.data);
  } catch(e) {
    document.getElementById('table-content').innerHTML = UI.error(e.message, 'loadTracer()');
  }
}

function renderCharts(data) {
  // Hitung per status
  var statusCount = {};
  var angkatanCount = {};
  data.forEach(function(d) {
    statusCount[d.status] = (statusCount[d.status] || 0) + 1;
    var ang = d.user ? d.user.angkatan : 'Unknown';
    angkatanCount[ang] = (angkatanCount[ang] || 0) + 1;
  });

  var statusLabels = Object.keys(statusCount);
  ChartTheme.make('chart-status', {
    type: 'doughnut',
    data: { labels: statusLabels, datasets: [{ data: Object.values(statusCount), paletteVars: statusLabels.map(ChartTheme.statusVar, ChartTheme), borderWidth: 2, hoverOffset: 4 }] },
    options: { ...ChartTheme.baseOptions, plugins: { legend: { position: 'right' } }, cutout: '55%' }
  }, 'Diagram distribusi status alumni: ' + statusLabels.map(function(l) { return l + ' ' + statusCount[l]; }).join(', '));

  var angkatanLabels = Object.keys(angkatanCount);
  ChartTheme.make('chart-angkatan', {
    type: 'bar',
    data: { labels: angkatanLabels, datasets: [{ label: 'Responden', data: Object.values(angkatanCount), paletteVars: angkatanLabels.map(function() { return '--chart-1'; }), borderRadius: 4, borderSkipped: false }] },
    options: { ...ChartTheme.baseOptions, scales: ChartTheme.barScales, plugins: { legend: { display: false } } }
  }, 'Diagram jumlah responden per angkatan: ' + angkatanLabels.map(function(l) { return l + ' ' + angkatanCount[l]; }).join(', '));
}

function renderTable(data) {
  if (!data || !data.length) {
    document.getElementById('table-content').innerHTML = UI.empty('Belum ada data tracer study', 'Ubah filter angkatan atau status.', 'chart-bar');
    return;
  }
  var rows = data.map(function(t) {
    var u      = t.user || {};
    var detail = t.jabatan || t.prodi || '—';
    return '<tr>' +
      '<td><div class="cell-name">' + UI.esc(u.name || '—') + '</div><div class="cell-sub mono">' + UI.esc(u.nisn || '') + '</div></td>' +
      '<td class="num">' + UI.esc(u.angkatan || '—') + '</td>' +
      '<td><span class="badge badge-' + statusBadge(t.status) + '">' + UI.esc(t.status) + '</span></td>' +
      '<td>' + UI.esc(t.nama_instansi || '—') + '</td>' +
      '<td>' + UI.esc(t.kota || '—') + '</td>' +
      '<td>' + UI.esc(detail) + '</td>' +
      '<td class="num">' + UI.esc(t.tahun_masuk || '—') + '</td>' +
      '</tr>';
  }).join('');
  document.getElementById('table-content').innerHTML =
    '<div class="table-wrap"><table><thead><tr><th>Alumni</th><th class="num">Angkatan</th><th>Status</th><th>Instansi</th><th>Kota</th><th>Prodi/Jabatan</th><th class="num">Tahun masuk</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function statusBadge(status) {
  if (!status) return 'neutral';
  if (status.includes('Kuliah')) return 'alumni';
  if (status === 'Bekerja') return 'accent';
  if (status === 'Wirausaha') return 'warning';
  if (status === 'Mencari Kerja') return 'danger';
  return 'neutral';
}

async function exportTracerCsv() {
  try {
    toast('Menyiapkan file CSV Tracer Study...', 'info');
    var angkatan = document.getElementById('filter-angkatan').value;
    var token    = localStorage.getItem('salut_token');
    var url      = API_BASE + '/admin/tracer-studies/export-csv' + (angkatan ? '?angkatan=' + angkatan : '');
    var res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) throw new Error('Gagal export — hanya Admin yang diizinkan.');
    var blob = await res.blob();
    var burl = window.URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = burl; a.download = 'Tracer_Study_SALUT_' + new Date().toISOString().split('T')[0] + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast('CSV Tracer Study berhasil diunduh!', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

// Sembunyikan export CSV untuk Guru
if (!isAdmin) {
  var btnExport = document.getElementById('btn-export-csv');
  if (btnExport) btnExport.style.display = 'none';
}

loadTracer();
</script>
</body>
</html>
