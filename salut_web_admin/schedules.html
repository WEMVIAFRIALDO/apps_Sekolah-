<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Kelulusan — SALUT Admin</title>
<meta name="description" content="Manajemen Jadwal Kelulusan Angkatan SALUT">
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="toast-container"></div>

<!-- Modal Tambah Jadwal (Admin only) -->
<div class="modal-overlay" id="modal-add">
  <div class="modal modal-sm">
    <div class="modal-title">Set Jadwal Kelulusan</div>
    <div class="modal-sub">Otomatis luluskan siswa kelas XII angkatan tertentu (Cronjob)</div>
    <div id="add-alert" class="alert alert-error" role="alert" hidden></div>
    <div class="form-group">
      <label class="form-label" for="inp-angkatan">Tahun angkatan</label>
      <input id="inp-angkatan" type="number" class="form-input mono" placeholder="Misal: 2026">
    </div>
    <div class="form-group">
      <label class="form-label" for="inp-date">Tanggal pengumuman (otomatis)</label>
      <input id="inp-date" type="datetime-local" class="form-input mono">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" onclick="submitAdd()"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Simpan jadwal</button>
      <button type="button" class="btn btn-ghost" onclick="document.getElementById('modal-add').classList.remove('show')">Batal</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" aria-label="Navigasi utama">
    <div class="sidebar-logo">
      <img class="brand-mark" src="img/logo_salut.png" alt="">
      <div>
        <p class="brand-role" id="sidebar-role-label">Admin Panel</p>
        <span class="brand-sub">v1.0 • SMK 1 Teladan</span>
      </div>
    </div>
    <nav class="nav-section" id="sidebar-nav" aria-label="Menu"></nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <div class="user-name" id="nav-user-name">Memuat...</div>
          <div class="user-role" id="nav-user-role">peran</div>
        </div>
      </div>
      <button type="button" class="btn-logout" id="btn-logout"><svg class="icon" aria-hidden="true"><use href="#i-log-out"/></svg>Keluar</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 class="page-title">Jadwal Kelulusan</h1><p class="page-sub">Manajemen jadwal pengumuman otomatis (Cronjob)</p></div>
      <div class="btn-group">
        <button type="button" class="btn btn-primary" id="btn-add-schedule" onclick="document.getElementById('modal-add').classList.add('show')" hidden><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Set jadwal baru</button>
      </div>
    </header>

    <div class="content">
      <div id="table-content"></div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.12/dist/motion.js"></script>
<script src="js/motion.js"></script>
<script>
  function showAlert(msg) {
    const el = document.getElementById('add-alert');
    el.textContent = msg; el.style.display = 'block';
  }

  async function loadSchedules() {
    const box = document.getElementById('table-content');
    box.innerHTML = UI.loading(4);

    try {
      const res = await Api.get('/admin/schedules');
      if (!res.success) throw new Error('Server menolak permintaan.');

      if (res.data.length === 0) {
        box.innerHTML = UI.empty('Belum ada jadwal kelulusan', 'Admin dapat menambahkan jadwal lewat tombol "Set jadwal baru".', 'calendar');
        return;
      }

      const rows = res.data.map(s => {
        const statusBadge = s.status === 'completed'
          ? `<span class="badge badge-success">${Icons.svg('check-circle', 12)}Selesai</span>`
          : `<span class="badge badge-warning">${Icons.svg('clock', 12)}Menunggu</span>`;

        return `<tr id="schedules-row-${UI.esc(s.id)}">
          <td class="mono cell-name">${UI.esc(s.angkatan)}</td>
          <td class="mono">${UI.esc(new Date(s.graduation_date).toLocaleString('id-ID'))}</td>
          <td>${statusBadge}</td>
        </tr>`;
      }).join('');

      box.innerHTML = `<div class="table-wrap"><table id="schedules-table">
        <thead><tr><th>Angkatan</th><th>Tanggal kelulusan</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    } catch (e) {
      box.innerHTML = UI.error(e.message, 'loadSchedules()');
    }
  }

  async function submitAdd() {
    const angkatan = document.getElementById('inp-angkatan').value;
    const date = document.getElementById('inp-date').value;
    document.getElementById('add-alert').style.display = 'none';

    if(!angkatan || !date) return showAlert('Semua field harus diisi.');

    try {
      const res = await Api.post('/admin/schedules', { angkatan, graduation_date: date });
      if (res.success) {
        document.getElementById('modal-add').classList.remove('show');
        document.getElementById('inp-angkatan').value = '';
        document.getElementById('inp-date').value = '';
        toast('Jadwal kelulusan disimpan.', 'success');
        loadSchedules();
      } else {
        showAlert(res.message || 'Gagal menyimpan jadwal');
      }
    } catch (e) {
      showAlert(e.message || 'Gagal menyimpan jadwal');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    Auth.guard();
    Auth.buildNav('schedules');

    const user = Auth.user();
    if(user && user.role === 'admin') {
      const btnAdd = document.getElementById('btn-add-schedule');
      if (btnAdd) btnAdd.hidden = false;
    }
    loadSchedules();
  });
</script>
</body>
</html>
