<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validasi Prestasi — SALUT Admin</title>
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="toast-container"></div>
<!-- Modal Validasi -->
<div class="modal-overlay" id="modal-validate">
  <div class="modal">
    <div class="modal-title" id="modal-title">Validasi Prestasi</div>
    <div class="modal-sub" id="modal-sub">Tinjau dan berikan keputusan validasi</div>
    <dl id="modal-info" class="info-panel"></dl>
    <div class="form-group">
      <label class="form-label" for="inp-catatan">Catatan (opsional, wajib jika ditolak)</label>
      <textarea id="inp-catatan" class="form-input form-textarea" rows="3" placeholder="Masukkan alasan penolakan atau catatan..."></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-success" onclick="submitValidasi('Approved')"><svg class="icon" aria-hidden="true"><use href="#i-check-circle"/></svg>Setujui</button>
      <button type="button" class="btn btn-danger" onclick="submitValidasi('Rejected')"><svg class="icon" aria-hidden="true"><use href="#i-x-circle"/></svg>Tolak</button>
      <button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" aria-label="Navigasi utama">
    <div class="sidebar-logo">
      <img class="brand-mark" src="img/logo_salut.png" alt="">
      <div>
        <p class="brand-role" id="sidebar-role-label">Admin Panel</p>
        <span class="brand-sub">v1.0 • SMK 1 Teladan</span>
      </div>
    </div>
    <nav class="nav-section" id="sidebar-nav" aria-label="Menu"></nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <div class="user-name" id="nav-user-name">Memuat...</div>
          <div class="user-role" id="nav-user-role">peran</div>
        </div>
      </div>
      <button type="button" class="btn-logout" id="btn-logout"><svg class="icon" aria-hidden="true"><use href="#i-log-out"/></svg>Keluar</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 class="page-title">Validasi Prestasi</h1><p class="page-sub">Review dan validasi prestasi yang dikirim siswa</p></div>
    </header>
    <div class="content">
      <!-- Filter status -->
      <div class="toolbar" role="group" aria-label="Filter status prestasi">
        <button type="button" class="btn btn-ghost btn-sm tab-btn is-current" aria-pressed="true" onclick="filterStatus('', this)">Semua</button>
        <button type="button" class="btn btn-ghost btn-sm tab-btn" aria-pressed="false" onclick="filterStatus('Pending', this)"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>Pending</button>
        <button type="button" class="btn btn-ghost btn-sm tab-btn" aria-pressed="false" onclick="filterStatus('Approved', this)"><svg class="icon" aria-hidden="true"><use href="#i-check-circle"/></svg>Approved</button>
        <button type="button" class="btn btn-ghost btn-sm tab-btn" aria-pressed="false" onclick="filterStatus('Rejected', this)"><svg class="icon" aria-hidden="true"><use href="#i-x-circle"/></svg>Rejected</button>
      </div>

      <div id="table-content"></div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.12/dist/motion.js"></script>
<script src="js/motion.js"></script>
<script>
Auth.init();
Auth.buildNav('prestasi');

let allData = [];
let currentId = null;
let currentStatus = '';
const statusIcon = { Pending: 'clock', Approved: 'check-circle', Rejected: 'x-circle' };
const statusDone = { Approved: 'disetujui', Rejected: 'ditolak' };

async function loadData(status='') {
    currentStatus = status;
    document.getElementById('table-content').innerHTML = UI.loading();
    try {
        const path = '/admin/achievements' + (status ? `?status=${status}` : '');
        const res = await Api.get(path);
        allData = res.data?.data || res.data || [];
        renderTable(allData);
    } catch(e) { document.getElementById('table-content').innerHTML = UI.error(e.message, `loadData('${status}')`); }
}

function renderTable(data) {
    if (!data.length) {
        document.getElementById('table-content').innerHTML = UI.empty('Tidak ada prestasi', 'Belum ada prestasi dengan status ini.', 'badge-check');
        return;
    }
    const rows = data.map(a => `
        <tr>
            <td>
                <div class="cell-name">${UI.esc(a.nama_kegiatan)}</div>
                <div class="cell-sub">${UI.esc(a.penyelenggara)}</div>
            </td>
            <td>
                <div class="cell-name">${UI.esc(a.user?.name || '—')}</div>
                <div class="cell-sub mono">NISN ${UI.esc(a.user?.nisn || '—')}</div>
            </td>
            <td><span class="badge">${UI.esc(a.tingkat)}</span></td>
            <td>${UI.esc(a.peringkat)}</td>
            <td class="num">${UI.esc(a.tahun)}</td>
            <td><span class="badge badge-${UI.esc(a.status_validasi.toLowerCase())}">${Icons.svg(statusIcon[a.status_validasi] || 'info', 12)}${UI.esc(a.status_validasi)}</span></td>
            <td>
                ${a.status_validasi === 'Pending' ? `<button type="button" class="btn btn-primary btn-sm" onclick="openModal(${JSON.stringify(a).replace(/&/g,'&amp;').replace(/"/g,'&quot;')})">Review</button>` : '<span class="text-muted">Sudah diproses</span>'}
            </td>
        </tr>`).join('');

    document.getElementById('table-content').innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Nama kegiatan</th><th>Siswa</th><th>Tingkat</th>
              <th>Peringkat</th><th class="num">Tahun</th><th>Status</th><th>Aksi</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
}

function filterStatus(status, el) {
    document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('is-current'); b.setAttribute('aria-pressed', 'false'); });
    el.classList.add('is-current');
    el.setAttribute('aria-pressed', 'true');
    loadData(status);
}

function openModal(achievement) {
    currentId = achievement.id;
    document.getElementById('modal-title').textContent = achievement.nama_kegiatan;
    document.getElementById('modal-sub').textContent = `${achievement.penyelenggara} • ${achievement.tingkat} • ${achievement.tahun}`;
    document.getElementById('modal-info').innerHTML = `
        <div><dt>Peringkat</dt><dd>${UI.esc(achievement.peringkat)}</dd></div>
        <div><dt>Siswa</dt><dd>${UI.esc(achievement.user?.name || '—')}</dd></div>
        <div class="info-wide"><dt>Deskripsi</dt><dd>${UI.esc(achievement.deskripsi || '—')}</dd></div>`;
    document.getElementById('inp-catatan').value = '';
    document.getElementById('modal-validate').classList.add('show');
}
function closeModal() { document.getElementById('modal-validate').classList.remove('show'); }

async function submitValidasi(status) {
    const catatan = document.getElementById('inp-catatan').value.trim();
    if (status === 'Rejected' && !catatan) { toast('Wajib isi catatan alasan penolakan.','error'); return; }
    try {
        await Api.patch(`/admin/achievements/${currentId}/validate`, { status, catatan });
        toast(`Prestasi berhasil ${statusDone[status] || status}.`, 'success');
        closeModal();
        loadData(currentStatus);
    } catch(e) { toast('Gagal memproses validasi.', 'error'); }
}

loadData();
</script>
</body>
</html>
