<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALUT — Login Admin</title>
<meta name="description" content="Portal Admin SALUT — Sistem Arsip Lulusan & Tracer Study">
<link rel="stylesheet" href="css/style.css">
<style>
body { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.12) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(6,182,212,0.08) 0%, transparent 60%), var(--navy); }
.login-wrap { width: 100%; max-width: 420px; padding: 24px; }
.logo-block { text-align: center; margin-bottom: 40px; }
.logo-icon { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #6366F1, #06B6D4); display: inline-flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 16px; box-shadow: 0 12px 40px rgba(99,102,241,0.35); }
.logo-block h1 { font-size: 28px; font-weight: 900; letter-spacing: 4px; }
.logo-block h1 span { background: linear-gradient(135deg, #6366F1, #06B6D4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo-block p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.login-card { background: rgba(30,41,59,0.8); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.login-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.login-card p { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.btn-login { width: 100%; padding: 14px; font-size: 15px; border-radius: 12px; background: linear-gradient(135deg, #6366F1, #4F46E5); color: white; border: none; font-family: 'Inter', sans-serif; font-weight: 700; cursor: pointer; transition: all 0.25s; letter-spacing: 0.3px; }
.btn-login:hover { box-shadow: 0 6px 24px rgba(99,102,241,0.45); transform: translateY(-2px); }
.btn-login:disabled { opacity: 0.6; transform: none; cursor: wait; }
.role-hint { margin-top: 20px; padding: 12px 16px; background: rgba(99,102,241,0.07); border-radius: 10px; border: 1px solid rgba(99,102,241,0.15); }
.role-hint p { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
.hint-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
.hint-row strong { color: var(--text); }
.security-note { text-align: center; margin-top: 20px; font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo-block">
    <div class="logo-icon">🎓</div>
    <h1><span>SALUT</span></h1>
    <p>Sistem Arsip Lulusan & Tracer Study</p>
  </div>
  <div class="login-card">
    <h2>Masuk Panel Admin</h2>
    <p>Khusus untuk Guru & Administrator sekolah</p>
    <div id="alert" class="alert alert-error" style="display:none"></div>
    <div class="form-group">
      <label class="form-label">NISN / ID Pengguna</label>
      <input id="inp-nisn" class="form-input" type="text" placeholder="Masukkan NISN Anda" maxlength="10" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="inp-pass" class="form-input" type="password" placeholder="Masukkan password" autocomplete="current-password">
    </div>
    <button id="btn-login" class="btn-login" onclick="doLogin()">Masuk</button>
    <div class="role-hint">
      <p>🔑 Akun Demo (Development)</p>
      <div class="hint-row"><span>Admin</span><span><strong>0000000001</strong> / admin123</span></div>
      <div class="hint-row"><span>Guru</span><span><strong>0000000002</strong> / guru123</span></div>
    </div>
  </div>
  <p class="security-note">🔒 Koneksi diamankan dengan JWT Encryption</p>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
// Redirect jika sudah login
if (localStorage.getItem('salut_token')) window.location.href = 'dashboard.html';

const btnLogin = document.getElementById('btn-login');
const alertEl  = document.getElementById('alert');

document.getElementById('inp-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});

async function doLogin() {
    const nisn = document.getElementById('inp-nisn').value.trim();
    const pass = document.getElementById('inp-pass').value;
    alertEl.style.display = 'none';

    if (!nisn || !pass) {
        showAlert('NISN dan password wajib diisi.'); return;
    }

    btnLogin.disabled = true;
    btnLogin.textContent = 'Memverifikasi...';

    try {
        const res = await Api.post('/login', { nisn, password: pass });
        if (!res.success) { showAlert(res.message || 'Login gagal.'); return; }

        // Hanya izinkan admin dan guru
        if (!['admin','guru'].includes(res.user.role)) {
            showAlert('Akses ditolak. Portal ini hanya untuk Admin & Guru.');
            return;
        }
        Auth.login(res.token, res.user);
    } catch(e) {
        showAlert(e.message || 'NISN atau password salah.');
    } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Masuk';
    }
}
function showAlert(msg) {
    alertEl.textContent = msg;
    alertEl.style.display = 'block';
}
</script>
</body>
</html>
