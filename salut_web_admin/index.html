<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALUT — Portal Admin & Guru</title>
<meta name="description" content="Portal Resmi Admin & Guru SALUT — SMK Negeri 1 Teladan">
<link rel="stylesheet" href="css/style.css">
<style>
body {
    display: flex; align-items: center; justify-content: center;
    background-color: var(--navy-bg);
    background-image: var(--body-bg-gradient);
    min-height: 100vh;
    padding: 32px 16px;
    color: var(--text);
    transition: background-color 0.3s ease, color 0.3s ease;
    position: relative;
}
.theme-switch-bar {
    position: absolute;
    top: 20px;
    right: 24px;
    z-index: 50;
}
.theme-switch-btn {
    background: var(--navy-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-card);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
}
.theme-switch-btn:hover {
    border-color: var(--primary);
    transform: translateY(-1px);
}
.login-wrap { width: 100%; max-width: 440px; margin: auto; }
.logo-block { text-align: center; margin-bottom: 24px; }

.logo-img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    filter: drop-shadow(0 0 24px rgba(6, 182, 212, 0.45)) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35));
    margin-bottom: 14px;
    transition: transform 0.3s ease;
}
.logo-img:hover {
    transform: scale(1.04);
}

.badge-portal {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 16px; border-radius: 30px;
    background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.35);
    color: var(--primary); font-size: 11px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase;
    margin-bottom: 14px;
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
}
.badge-dot { width: 7px; height: 7px; border-radius: 50%; background: #00F2FE; box-shadow: 0 0 8px #00F2FE; }

.logo-block h1 { font-size: 22px; font-weight: 900; color: var(--text); letter-spacing: 1px; }
.logo-block p { color: var(--muted); font-size: 13px; margin-top: 4px; font-weight: 500; }

.login-card {
    background: var(--navy-card);
    backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 32px;
    box-shadow: var(--shadow-glass);
    transition: background 0.3s ease, border-color 0.3s ease;
}
.login-card h2 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 4px; letter-spacing: -0.3px; }
.login-card p.sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; font-weight: 500; }

.btn-login {
    width: 100%; padding: 13px; font-size: 14.5px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: white; border: none; font-family: inherit;
    font-weight: 700; cursor: pointer; transition: all 0.25s;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 18px var(--primary-glow);
}
.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px var(--primary-glow);
}
.btn-login:disabled { opacity: 0.6; transform: none; cursor: wait; }

.role-hint {
    margin-top: 22px; padding: 14px 16px;
    background: var(--navy-subtle); border-radius: 14px;
    border: 1px solid var(--border);
}
.role-hint p { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.hint-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 5px; }
.hint-row strong { color: var(--text); font-family: monospace; font-size: 12.5px; }

.security-note {
    text-align: center; margin-top: 24px; font-size: 11.5px;
    color: var(--muted-dim); display: flex; align-items: center; justify-content: center; gap: 6px;
    font-weight: 600;
}
</style>
</head>
<body>
<div class="theme-switch-bar">
  <button class="theme-switch-btn theme-toggle-btn" onclick="Theme.toggle()">
    🌙 Mode Gelap
  </button>
</div>

<div class="login-wrap">
  <div class="logo-block">
    <div>
      <img src="img/logo_salut.png" alt="Logo SALUT" class="logo-img">
    </div>
    <div class="badge-portal">
      <span class="badge-dot"></span> PORTAL RESMI AKADEMIK & ALUMNI
    </div>
    <h1>SMK NEGERI 1 TELADAN</h1>
    <p>Sistem Administrasi Kelulusan & Tracer Study</p>
  </div>

  <div class="login-card">
    <h2>Masuk Panel Admin</h2>
    <p class="sub">Akses khusus Administrator & Dewan Guru</p>

    <div id="alert" class="alert alert-error" style="display:none"></div>

    <div class="form-group">
      <label class="form-label">NISN / ID Pengguna</label>
      <input id="inp-nisn" class="form-input" type="text" placeholder="Masukkan ID Pengguna / NISN" maxlength="10" autocomplete="username">
    </div>

    <div class="form-group">
      <label class="form-label">Kata Sandi</label>
      <input id="inp-pass" class="form-input" type="password" placeholder="Masukkan kata sandi akun" autocomplete="current-password">
    </div>

    <button id="btn-login" class="btn-login" onclick="doLogin()">Masuk ke Panel</button>

    <div class="role-hint">
      <p>🔑 Akun Demo (Development Mode)</p>
      <div class="hint-row"><span>Admin</span><span><strong>0000000001</strong> / admin123</span></div>
      <div class="hint-row"><span>Guru</span><span><strong>0000000002</strong> / guru123</span></div>
    </div>
  </div>

  <p class="security-note">🔒 Terenkripsi Aman • JWT Auth Keystore • SALUT v1.0</p>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
// Redirect jika sudah login
if (localStorage.getItem('salut_token')) window.location.href = 'dashboard.html';

const btnLogin = document.getElementById('btn-login');
const alertEl  = document.getElementById('alert');

document.getElementById('inp-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});

async function doLogin() {
    const nisn = document.getElementById('inp-nisn').value.trim();
    const pass = document.getElementById('inp-pass').value;
    alertEl.style.display = 'none';

    if (!nisn || !pass) {
        showAlert('NISN dan password wajib diisi.'); return;
    }

    btnLogin.disabled = true;
    btnLogin.textContent = 'Memverifikasi kredensial...';

    try {
        const res = await Api.post('/login', { nisn, password: pass });
        if (!res.success) { showAlert(res.message || 'Login gagal.'); return; }

        // Hanya izinkan admin dan guru
        if (!['admin','guru'].includes(res.user.role)) {
            showAlert('Akses ditolak. Portal ini hanya untuk Admin & Guru.');
            return;
        }
        Auth.login(res.token, res.user);
    } catch(e) {
        showAlert(e.message || 'NISN atau kata sandi tidak sesuai.');
    } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Masuk ke Panel';
    }
}
function showAlert(msg) {
    alertEl.textContent = msg;
    alertEl.style.display = 'block';
}
</script>
</body>
</html>
