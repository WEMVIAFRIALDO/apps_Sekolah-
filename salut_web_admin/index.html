<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALUT — Portal Masuk Resmi</title>
<meta name="description" content="Portal Resmi Admin & Guru SALUT — SMK Negeri 1 Teladan">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
    background-color: #050811;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: #F8FAFC;
    display: flex;
    position: relative;
}

/* Ambient Deep Lighting */
.bg-ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}
.ambient-glow-1 {
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(139, 92, 246, 0.1) 40%, transparent 70%);
    top: -200px;
    left: 5%;
    filter: blur(80px);
}
.ambient-glow-2 {
    position: absolute;
    width: 650px;
    height: 650px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, rgba(59, 130, 246, 0.08) 45%, transparent 70%);
    bottom: -150px;
    right: 10%;
    filter: blur(90px);
}

/* Full Screen Split Layout (No Fake Window Bar / 100% Immersive) */
.fullscreen-login-wrapper {
    position: relative;
    z-index: 10;
    width: 100vw;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.25fr 0.75fr;
    background: transparent;
}

/* Left Hero Section (Full Height 3D Crystal Showcase) */
.hero-section {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 56px;
    background-image: url('img/crystal_hero_desktop.jpg');
    background-size: cover;
    background-position: center;
    overflow: hidden;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
}
.hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(5, 8, 17, 0.45) 0%, rgba(10, 15, 28, 0.2) 40%, rgba(5, 8, 17, 0.8) 100%);
    pointer-events: none;
}

.brand-header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 16px;
}
.brand-logo-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 24px rgba(99, 102, 241, 0.45);
}
.brand-logo-icon img {
    width: 32px;
    height: 32px;
    object-fit: contain;
}
.brand-text h3 {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.8px;
    background: linear-gradient(135deg, #FFFFFF 0%, #C7D2FE 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.brand-text p {
    font-size: 12px;
    color: #94A3B8;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.hero-footer-badge {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-radius: 30px;
    background: rgba(10, 15, 28, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    font-size: 12px;
    color: #CBD5E1;
    width: fit-content;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}
.pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00F2FE;
    box-shadow: 0 0 10px #00F2FE;
}

/* Right Form Section (Floating Frosted Glass Card) */
.form-section {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 40px;
    position: relative;
    background: radial-gradient(circle at 50% 50%, rgba(20, 27, 48, 0.6) 0%, rgba(5, 8, 17, 0.98) 100%);
    backdrop-filter: blur(10px);
}

.frosted-glass-card {
    width: 100%;
    max-width: 420px;
    background: rgba(18, 24, 42, 0.68);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 30px;
    padding: 40px 32px;
    backdrop-filter: blur(30px) saturate(190%);
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 0 40px rgba(99, 102, 241, 0.14);
    transition: transform 0.3s ease, border-color 0.3s ease;
}
.frosted-glass-card:hover {
    border-color: rgba(99, 102, 241, 0.4);
}

.card-brand {
    text-align: center;
    margin-bottom: 28px;
}
.card-logo-gem {
    width: 64px;
    height: 64px;
    margin: 0 auto 14px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.25) 0%, rgba(6, 182, 212, 0.25) 100%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 28px rgba(99, 102, 241, 0.4);
}
.card-logo-gem img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.5));
}
.card-brand h2 {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.6px;
    background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.card-brand p {
    font-size: 13px;
    color: #94A3B8;
    margin-top: 4px;
    font-weight: 500;
}

/* Pill Input Style (Exact to Reference) */
.input-pill-group {
    position: relative;
    margin-bottom: 18px;
}
.input-pill-box {
    position: relative;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 0 20px;
    height: 54px;
    transition: all 0.25s ease;
}
.input-pill-box:focus-within {
    border-color: #818CF8;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 22px rgba(99, 102, 241, 0.3);
}
.pill-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94A3B8;
    margin-right: 14px;
    font-size: 18px;
    transition: color 0.25s ease;
}
.input-pill-box:focus-within .pill-icon {
    color: #A5B4FC;
}
.pill-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #FFFFFF;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
}
.pill-input::placeholder {
    color: #64748B;
    font-size: 13.5px;
}
.toggle-eye-btn {
    background: transparent;
    border: none;
    color: #64748B;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    transition: color 0.2s ease;
}
.toggle-eye-btn:hover {
    color: #CBD5E1;
}

/* Action Gradient Button with Arrow (Exact to Reference) */
.btn-gradient-action {
    width: 100%;
    height: 54px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(90deg, #6366F1 0%, #8B5CF6 50%, #3B82F6 100%);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    box-shadow: 
        0 8px 24px rgba(99, 102, 241, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    margin-top: 22px;
    position: relative;
    overflow: hidden;
}
.btn-gradient-action:hover {
    transform: translateY(-2px);
    box-shadow: 
        0 14px 34px rgba(99, 102, 241, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.btn-gradient-action:active {
    transform: translateY(0);
}
.btn-gradient-action:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
}
.btn-arrow {
    font-size: 19px;
    font-weight: 700;
    transition: transform 0.25s ease;
}
.btn-gradient-action:hover .btn-arrow {
    transform: translateX(4px);
}

/* Bottom Pagination / Role Selector Dots (Exact to Reference) */
.bottom-dots-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 26px;
    padding-top: 8px;
}
.role-pill-dot {
    cursor: pointer;
    height: 8px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    outline: none;
}
.role-pill-dot.dot-inactive {
    width: 8px;
}
.role-pill-dot.dot-inactive:hover {
    background: rgba(255, 255, 255, 0.4);
    transform: scale(1.2);
}
.role-pill-dot.dot-active {
    width: 28px;
    background: linear-gradient(90deg, #818CF8, #00F2FE);
    box-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
}

/* Role Label Indicator below dots */
.role-label-text {
    text-align: center;
    font-size: 11.5px;
    color: #94A3B8;
    margin-top: 8px;
    font-weight: 600;
    letter-spacing: 0.4px;
}
.role-badge-tag {
    color: #818CF8;
    font-weight: 700;
}

/* Alert Notification */
.alert-box {
    display: none;
    padding: 11px 16px;
    margin-bottom: 18px;
    border-radius: 14px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #FCA5A5;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Responsive Behavior for smaller screens / tablets */
@media (max-width: 960px) {
    .fullscreen-login-wrapper {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
    }
    .hero-section {
        min-height: 280px;
        padding: 32px 24px;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .form-section {
        padding: 40px 20px 60px;
    }
}
</style>
</head>
<body>

<div class="bg-ambient">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
</div>

<div class="fullscreen-login-wrapper">
    <!-- Left Hero Section with Full-Height 3D Crystal Visual -->
    <div class="hero-section">
        <div class="hero-overlay"></div>
        
        <div class="brand-header">
            <div class="brand-logo-icon">
                <img src="img/logo_salut.png" alt="SALUT Emblem">
            </div>
            <div class="brand-text">
                <h3>SALUT</h3>
                <p>SMK NEGERI 1 TELADAN</p>
            </div>
        </div>

        <div class="hero-footer-badge">
            <span class="pulse-dot"></span>
            <span>Sistem Administrasi Kelulusan & Tracer Study</span>
        </div>
    </div>

    <!-- Right Glassmorphism Form Card -->
    <div class="form-section">
        <div class="frosted-glass-card">
            <div class="card-brand">
                <div class="card-logo-gem">
                    <img src="img/logo_salut.png" alt="SALUT Gem">
                </div>
                <h2>SALUT PORTAL</h2>
                <p id="sub-mode-desc">Akses Resmi Administrator</p>
            </div>

            <div id="alert" class="alert-box"></div>

            <!-- NISN / Username Pill Input -->
            <div class="input-pill-group">
                <div class="input-pill-box">
                    <div class="pill-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <input id="inp-nisn" class="pill-input" type="text" placeholder="NISN / ID Pengguna" maxlength="10" autocomplete="username" value="0000000001">
                </div>
            </div>

            <!-- Password Pill Input with Toggle Eye -->
            <div class="input-pill-group">
                <div class="input-pill-box">
                    <div class="pill-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <input id="inp-pass" class="pill-input" type="password" placeholder="Kata Sandi" autocomplete="current-password" value="admin123">
                    <button type="button" class="toggle-eye-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                        <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Action Button with Gradient and Arrow -->
            <button id="btn-login" class="btn-gradient-action" onclick="doLogin()">
                <span id="btn-text">Masuk</span>
                <span class="btn-arrow">→</span>
            </button>

            <!-- 3 Bottom Dots for Role Switching (Exact to Reference Mockup) -->
            <div class="bottom-dots-row">
                <button class="role-pill-dot dot-active" id="dot-0" onclick="switchRole(0)" title="Akun Admin"></button>
                <button class="role-pill-dot dot-inactive" id="dot-1" onclick="switchRole(1)" title="Akun Guru"></button>
                <button class="role-pill-dot dot-inactive" id="dot-2" onclick="switchRole(2)" title="Reset / Manual"></button>
            </div>
            <div class="role-label-text">
                Mode Akses: <span class="role-badge-tag" id="role-tag-name">Administrator</span>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
// Redirect jika sudah login
if (localStorage.getItem('salut_token')) window.location.href = 'dashboard.html';

const btnLogin  = document.getElementById('btn-login');
const btnText   = document.getElementById('btn-text');
const alertEl   = document.getElementById('alert');
const inpNisn   = document.getElementById('inp-nisn');
const inpPass   = document.getElementById('inp-pass');
const eyeIcon   = document.getElementById('eye-icon');
const subDesc   = document.getElementById('sub-mode-desc');
const roleTag   = document.getElementById('role-tag-name');

let currentRoleIndex = 0;
const rolesConfig = [
    { name: 'Administrator', nisn: '0000000001', pass: 'admin123', desc: 'Akses Penuh Administrator' },
    { name: 'Dewan Guru', nisn: '0000000002', pass: 'guru123', desc: 'Akses Verifikasi Nilai & Prestasi' },
    { name: 'Kustom / Input Manual', nisn: '', pass: '', desc: 'Masukkan Kredensial Pribadi' }
];

function switchRole(index) {
    currentRoleIndex = index;
    for (let i = 0; i < 3; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i === index) {
            dot.className = 'role-pill-dot dot-active';
        } else {
            dot.className = 'role-pill-dot dot-inactive';
        }
    }
    const conf = rolesConfig[index];
    roleTag.textContent = conf.name;
    subDesc.textContent = conf.desc;
    if (index < 2) {
        inpNisn.value = conf.nisn;
        inpPass.value = conf.pass;
    } else {
        inpNisn.value = '';
        inpPass.value = '';
        inpNisn.focus();
    }
    alertEl.style.display = 'none';
}

function togglePasswordVisibility() {
    if (inpPass.type === 'password') {
        inpPass.type = 'text';
        eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
    } else {
        inpPass.type = 'password';
        eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    }
}

inpPass.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});
inpNisn.addEventListener('keydown', e => {
    if (e.key === 'Enter') inpPass.focus();
});

async function doLogin() {
    const nisn = inpNisn.value.trim();
    const pass = inpPass.value;
    alertEl.style.display = 'none';

    if (!nisn || !pass) {
        showAlert('NISN dan kata sandi wajib diisi.');
        return;
    }

    btnLogin.disabled = true;
    btnText.textContent = 'Memverifikasi...';

    try {
        const res = await Api.post('/login', { nisn, password: pass });
        if (!res.success) {
            showAlert(res.message || 'Login gagal.');
            return;
        }

        if (!['admin', 'guru'].includes(res.user.role)) {
            showAlert('Akses ditolak. Portal ini khusus Admin & Guru.');
            return;
        }
        Auth.login(res.token, res.user);
    } catch(e) {
        showAlert(e.message || 'NISN atau kata sandi tidak sesuai.');
    } finally {
        btnLogin.disabled = false;
        btnText.textContent = 'Masuk';
    }
}

function showAlert(msg) {
    alertEl.textContent = msg;
    alertEl.style.display = 'block';
}
</script>
</body>
</html>
