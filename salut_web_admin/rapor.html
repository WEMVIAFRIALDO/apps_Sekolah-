<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Nilai Rapor — SALUT Admin/Guru</title>
<meta name="description" content="Manajemen Nilai Rapor Siswa SALUT">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast-container"></div>

<!-- Modal Input Rapor -->
<div class="modal-overlay" id="modal-rapor">
  <div class="modal" style="max-width:500px;">
    <div class="modal-title">Input Nilai Rapor Siswa</div>
    <div class="modal-sub" id="modal-student-name">Nama Siswa</div>
    <div id="rapor-alert" class="alert alert-error" style="display:none"></div>
    <input type="hidden" id="inp-student-id">
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;">
      <div class="form-group" style="margin:0">
        <label class="form-label">Semester</label>
        <select id="inp-semester" class="form-input form-select" onchange="loadStudentRapor(document.getElementById('inp-student-id').value)">
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3">Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5">Semester 5</option>
          <option value="6">Semester 6</option>
        </select>
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Tahun Akademik</label>
        <input id="inp-year" type="number" class="form-input" placeholder="Misal: 2026">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Nilai Rata-rata</label>
        <input id="inp-score" type="number" step="0.01" class="form-input" placeholder="0.0 - 100.0">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">Peringkat Kelas (Opsional)</label>
        <input id="inp-rank" type="number" class="form-input" placeholder="1">
      </div>
    </div>
    
    <div style="display:flex;gap:12px;margin-top:20px;">
      <button class="btn btn-primary" style="flex:1;" onclick="submitRapor()">✅ Simpan Nilai</button>
      <button class="btn btn-ghost" onclick="document.getElementById('modal-rapor').classList.remove('show')">Batal</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex; align-items:center; gap:12px;">
        <img src="img/logo_salut.png" alt="SALUT Logo" style="width:42px; height:42px; object-fit:contain; filter:drop-shadow(0 2px 8px rgba(6,182,212,0.4));">
        <div>
          <p id="sidebar-role-label" style="font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:1px; margin:0;">Admin Panel</p>
          <span style="font-size:10px; color:var(--cyan); font-weight:500;">v1.0 • SMK 1 Teladan</span>
        </div>
      </div>
    </div>
    <nav class="nav-section" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-card"><div class="user-avatar" id="user-avatar">A</div><div><div class="user-name" id="nav-user-name">Loading...</div><div class="user-role" id="nav-user-role">role</div></div></div>
      <button class="btn-logout" id="btn-logout">🚪 Keluar</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><div class="page-title">Nilai Rapor</div><div class="page-sub">Manajemen Nilai Rapor (Academic Records)</div></div>
    </div>

    <div class="content">
      <div class="card" style="padding: 16px; margin-bottom: 20px;">
        <div class="toolbar" style="margin-bottom: 0;">
          <select class="form-input form-select" id="filter-class" style="width:200px;" onchange="loadStudents()">
            <option value="">-- Semua Kelas --</option>
            <optgroup label="Kelas X">
              <option value="X TKJ 1">X TKJ 1</option>
              <option value="X TKJ 2">X TKJ 2</option>
              <option value="X RPL 1">X RPL 1</option>
              <option value="X Multimedia 1">X Multimedia 1</option>
            </optgroup>
            <optgroup label="Kelas XI">
              <option value="XI TKJ 1">XI TKJ 1</option>
              <option value="XI TKJ 2">XI TKJ 2</option>
              <option value="XI RPL 1">XI RPL 1</option>
              <option value="XI Multimedia 1">XI Multimedia 1</option>
            </optgroup>
            <optgroup label="Kelas XII">
              <option value="XII TKJ 1">XII TKJ 1</option>
              <option value="XII TKJ 2">XII TKJ 2</option>
              <option value="XII RPL 1">XII RPL 1</option>
              <option value="XII Multimedia 1">XII Multimedia 1</option>
            </optgroup>
          </select>
          <div style="color:var(--muted);font-size:14px;margin-left:12px;">Pilih kelas untuk melihat daftar siswa</div>
        </div>
      </div>

      <div class="card" style="padding: 0">
        <div style="overflow-x:auto;">
          <table class="data-table" id="students-table">
            <thead>
              <tr>
                <th>Nama Siswa</th>
                <th>NISN</th>
                <th>Kelas</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="4" style="text-align:center;padding:24px;">Pilih kelas terlebih dahulu.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  let currentStudentRecords = [];

  function toast(msg, type) {
    type = type || 'info';
    var el = document.createElement('div');
    el.className = 'toast toast-' + type;
    el.innerHTML = (type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️') + ' ' + msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(function() { el.remove(); }, 4000);
  }

  async function loadStudents() {
    const className = document.getElementById('filter-class').value;
    const tbody = document.querySelector('#students-table tbody');
    if (!className) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;">Pilih kelas terlebih dahulu.</td></tr>`;
      return;
    }

    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;">Memuat data...</td></tr>`;
    
    const res = await Api.get('/guru/rapor/students?class=' + encodeURIComponent(className));
    if (!res.success) return;
    
    tbody.innerHTML = '';
    if (res.data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;">Tidak ada siswa di kelas ini.</td></tr>`;
      return;
    }

    res.data.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:bold;">${s.name}</td>
        <td>${s.nisn}</td>
        <td>${s.class_name}</td>
        <td>
          <button class="btn btn-ghost" style="padding:4px 8px;font-size:12px;border:1px solid var(--border)" onclick="openRaporModal(${s.id}, '${s.name}')">✏️ Input Nilai</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function openRaporModal(id, name) {
    document.getElementById('inp-student-id').value = id;
    document.getElementById('modal-student-name').textContent = name;
    document.getElementById('modal-rapor').classList.add('show');
    
    document.getElementById('inp-year').value = new Date().getFullYear();
    document.getElementById('inp-score').value = '';
    document.getElementById('inp-rank').value = '';
    document.getElementById('rapor-alert').style.display = 'none';

    await loadStudentRapor(id);
  }

  async function loadStudentRapor(id) {
    const res = await Api.get('/guru/rapor/students/' + id);
    if (!res.success) return;
    currentStudentRecords = res.records;

    // Fill form if record for selected semester exists
    const semester = parseInt(document.getElementById('inp-semester').value);
    const record = currentStudentRecords.find(r => r.semester === semester);
    
    if (record) {
      document.getElementById('inp-year').value = record.academic_year;
      document.getElementById('inp-score').value = record.average_score;
      document.getElementById('inp-rank').value = record.rank || '';
    } else {
      document.getElementById('inp-score').value = '';
      document.getElementById('inp-rank').value = '';
    }
  }

  async function submitRapor() {
    const id = document.getElementById('inp-student-id').value;
    const semester = document.getElementById('inp-semester').value;
    const year = document.getElementById('inp-year').value;
    const score = document.getElementById('inp-score').value;
    const rank = document.getElementById('inp-rank').value;
    
    const alertEl = document.getElementById('rapor-alert');
    alertEl.style.display = 'none';

    if (!semester || !year || !score) {
      alertEl.textContent = 'Semester, Tahun Akademik, dan Nilai Rata-rata wajib diisi.';
      alertEl.style.display = 'block';
      return;
    }

    try {
      const res = await Api.post('/guru/rapor/students/' + id, {
        semester: semester,
        academic_year: year,
        average_score: score,
        rank: rank || null
      });
      document.getElementById('modal-rapor').classList.remove('show');
      toast('Nilai rapor berhasil disimpan!', 'success');
    } catch(e) {
      alertEl.textContent = e.message;
      alertEl.style.display = 'block';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    Auth.guard();
    Auth.buildNav('rapor');
  });
</script>
</body>
</html>
