<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Nilai Rapor — SALUT Admin/Guru</title>
<meta name="description" content="Manajemen Nilai Rapor Siswa SALUT">
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="toast-container"></div>

<!-- Modal Input Rapor -->
<div class="modal-overlay" id="modal-rapor">
  <div class="modal modal-sm">
    <div class="modal-title">Input Nilai Rapor Siswa</div>
    <div class="modal-sub" id="modal-student-name">Nama Siswa</div>
    <div id="rapor-alert" class="alert alert-error" role="alert" hidden></div>
    <input type="hidden" id="inp-student-id">

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="inp-semester">Semester</label>
        <select id="inp-semester" class="form-input form-select" onchange="loadStudentRapor(document.getElementById('inp-student-id').value)">
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3">Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5">Semester 5</option>
          <option value="6">Semester 6</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="inp-year">Tahun akademik</label>
        <input id="inp-year" type="number" class="form-input mono" placeholder="Misal: 2026">
      </div>
      <div class="form-group">
        <label class="form-label" for="inp-score">Nilai rata-rata</label>
        <input id="inp-score" type="number" step="0.01" class="form-input mono" placeholder="0.0 - 100.0">
      </div>
      <div class="form-group">
        <label class="form-label" for="inp-rank">Peringkat kelas (opsional)</label>
        <input id="inp-rank" type="number" class="form-input mono" placeholder="1">
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-primary" onclick="submitRapor()"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Simpan nilai</button>
      <button type="button" class="btn btn-ghost" onclick="document.getElementById('modal-rapor').classList.remove('show')">Batal</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" aria-label="Navigasi utama">
    <div class="sidebar-logo">
      <img class="brand-mark" src="img/logo_salut.png" alt="">
      <div>
        <p class="brand-role" id="sidebar-role-label">Admin Panel</p>
        <span class="brand-sub">v1.0 • SMK 1 Teladan</span>
      </div>
    </div>
    <nav class="nav-section" id="sidebar-nav" aria-label="Menu"></nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <div class="user-name" id="nav-user-name">Memuat...</div>
          <div class="user-role" id="nav-user-role">peran</div>
        </div>
      </div>
      <button type="button" class="btn-logout" id="btn-logout"><svg class="icon" aria-hidden="true"><use href="#i-log-out"/></svg>Keluar</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 class="page-title">Nilai Rapor</h1><p class="page-sub">Manajemen nilai rapor siswa per semester</p></div>
    </header>

    <div class="content">
      <div class="toolbar">
        <select class="form-input form-select" id="filter-class" aria-label="Pilih kelas" onchange="loadStudents()">
          <option value="">-- Semua Kelas --</option>
          <optgroup label="Kelas X">
            <option value="X TKJ 1">X TKJ 1</option>
            <option value="X TKJ 2">X TKJ 2</option>
            <option value="X RPL 1">X RPL 1</option>
            <option value="X Multimedia 1">X Multimedia 1</option>
          </optgroup>
          <optgroup label="Kelas XI">
            <option value="XI TKJ 1">XI TKJ 1</option>
            <option value="XI TKJ 2">XI TKJ 2</option>
            <option value="XI RPL 1">XI RPL 1</option>
            <option value="XI Multimedia 1">XI Multimedia 1</option>
          </optgroup>
          <optgroup label="Kelas XII">
            <option value="XII TKJ 1">XII TKJ 1</option>
            <option value="XII TKJ 2">XII TKJ 2</option>
            <option value="XII RPL 1">XII RPL 1</option>
            <option value="XII Multimedia 1">XII Multimedia 1</option>
          </optgroup>
        </select>
        <span class="text-muted">Pilih kelas untuk melihat daftar siswa</span>
      </div>

      <div class="table-wrap">
        <table id="students-table">
          <thead>
            <tr>
              <th>Nama siswa</th>
              <th>NISN</th>
              <th>Kelas</th>
              <th class="col-right">Aksi</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.12/dist/motion.js"></script>
<script src="js/motion.js"></script>
<script>
  let currentStudentRecords = [];

  function stateRow(html) {
    return `<tr><td colspan="4">${html}</td></tr>`;
  }

  async function loadStudents() {
    const className = document.getElementById('filter-class').value;
    const tbody = document.querySelector('#students-table tbody');
    if (!className) {
      tbody.innerHTML = stateRow(UI.empty('Pilih kelas terlebih dahulu', 'Daftar siswa muncul setelah kelas dipilih.', 'users'));
      return;
    }

    tbody.innerHTML = stateRow(UI.loading(5, false));

    try {
      const res = await Api.get('/guru/rapor/students?class=' + encodeURIComponent(className));
      if (!res.success) throw new Error('Server menolak permintaan.');

      tbody.innerHTML = '';
      if (res.data.length === 0) {
        tbody.innerHTML = stateRow(UI.empty('Tidak ada siswa di kelas ini', 'Pilih kelas lain.', 'users'));
        return;
      }

      res.data.forEach(s => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="cell-name">${UI.esc(s.name)}</td>
          <td class="mono">${UI.esc(s.nisn)}</td>
          <td>${UI.esc(s.class_name)}</td>
          <td class="col-right">
            <button type="button" class="btn btn-ghost btn-sm" onclick="openRaporModal(${s.id}, '${UI.esc(String(s.name).replace(/'/g, "\\'"))}')">${Icons.svg('clipboard-check', 16)}Input nilai</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    } catch (e) {
      tbody.innerHTML = stateRow(UI.error(e.message, 'loadStudents()'));
    }
  }

  async function openRaporModal(id, name) {
    document.getElementById('inp-student-id').value = id;
    document.getElementById('modal-student-name').textContent = name;
    document.getElementById('modal-rapor').classList.add('show');

    document.getElementById('inp-year').value = new Date().getFullYear();
    document.getElementById('inp-score').value = '';
    document.getElementById('inp-rank').value = '';
    document.getElementById('rapor-alert').style.display = 'none';

    await loadStudentRapor(id);
  }

  async function loadStudentRapor(id) {
    const res = await Api.get('/guru/rapor/students/' + id);
    if (!res.success) return;
    currentStudentRecords = res.records;

    // Fill form if record for selected semester exists
    const semester = parseInt(document.getElementById('inp-semester').value);
    const record = currentStudentRecords.find(r => r.semester === semester);

    if (record) {
      document.getElementById('inp-year').value = record.academic_year;
      document.getElementById('inp-score').value = record.average_score;
      document.getElementById('inp-rank').value = record.rank || '';
    } else {
      document.getElementById('inp-score').value = '';
      document.getElementById('inp-rank').value = '';
    }
  }

  async function submitRapor() {
    const id = document.getElementById('inp-student-id').value;
    const semester = document.getElementById('inp-semester').value;
    const year = document.getElementById('inp-year').value;
    const score = document.getElementById('inp-score').value;
    const rank = document.getElementById('inp-rank').value;

    const alertEl = document.getElementById('rapor-alert');
    alertEl.style.display = 'none';

    if (!semester || !year || !score) {
      alertEl.textContent = 'Semester, Tahun Akademik, dan Nilai Rata-rata wajib diisi.';
      alertEl.style.display = 'block';
      return;
    }

    try {
      const res = await Api.post('/guru/rapor/students/' + id, {
        semester: semester,
        academic_year: year,
        average_score: score,
        rank: rank || null
      });
      document.getElementById('modal-rapor').classList.remove('show');
      toast('Nilai rapor berhasil disimpan.', 'success');
    } catch(e) {
      alertEl.textContent = e.message;
      alertEl.style.display = 'block';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    Auth.guard();
    Auth.buildNav('rapor');
    loadStudents();
  });
</script>
</body>
</html>
