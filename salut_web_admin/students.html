<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen Siswa — SALUT Admin</title>
<meta name="description" content="Manajemen data siswa dan alumni SALUT">
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="toast-container"></div>
<!-- Modal Tambah Siswa (Admin only) -->
<div class="modal-overlay" id="modal-add">
  <div class="modal modal-md">
    <div class="modal-title">Tambah Pengguna Baru</div>
    <div class="modal-sub">Daftarkan akun siswa, alumni, atau guru baru</div>
    <div id="add-alert" class="alert alert-error" role="alert" hidden></div>
    <div class="form-grid-2">
      <div class="form-group"><label class="form-label" for="inp-name">Nama Lengkap</label><input id="inp-name" class="form-input" placeholder="Nama lengkap"></div>
      <div class="form-group"><label class="form-label" for="inp-nisn">NISN (10 digit)</label><input id="inp-nisn" class="form-input mono" placeholder="0000000000" maxlength="10"></div>
      <div class="form-group"><label class="form-label" for="inp-email">Email (opsional)</label><input id="inp-email" class="form-input" type="email" placeholder="email@example.com"></div>
      <div class="form-group"><label class="form-label" for="inp-phone">No. HP</label><input id="inp-phone" class="form-input" placeholder="+62..."></div>
      <div class="form-group"><label class="form-label" for="inp-role">Role</label>
        <select id="inp-role" class="form-input form-select" onchange="toggleFields()">
          <option value="siswa">Siswa Aktif</option>
          <option value="alumni">Alumni</option>
          <option value="guru">Guru</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label" for="inp-pass">Password</label><input id="inp-pass" class="form-input" type="password" placeholder="Min. 6 karakter"></div>
      <div class="form-group student-field"><label class="form-label" for="inp-class">Kelas</label>
        <select id="inp-class" class="form-input form-select">
          <option value="">-- Pilih Kelas --</option>
          <optgroup label="Kelas X"><option>X TKJ 1</option><option>X TKJ 2</option><option>X RPL 1</option><option>X Multimedia 1</option></optgroup>
          <optgroup label="Kelas XI"><option>XI TKJ 1</option><option>XI TKJ 2</option><option>XI RPL 1</option><option>XI Multimedia 1</option></optgroup>
          <optgroup label="Kelas XII"><option>XII TKJ 1</option><option>XII TKJ 2</option><option>XII RPL 1</option><option>XII Multimedia 1</option></optgroup>
        </select>
      </div>
      <div class="form-group student-field"><label class="form-label" for="inp-angkatan">Angkatan</label><input id="inp-angkatan" class="form-input mono" placeholder="2026" maxlength="4"></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" onclick="submitAdd()"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Simpan pengguna</button>
      <button type="button" class="btn btn-ghost" onclick="document.getElementById('modal-add').classList.remove('show')">Batal</button>
    </div>
  </div>
</div>

<!-- Modal Import CSV -->
<div class="modal-overlay" id="modal-import">
  <div class="modal modal-sm">
    <div class="modal-title">Import Data Siswa (CSV)</div>
    <div class="modal-sub">Format: Nama, NISN, Email, Role, Kelas, Angkatan, No HP</div>
    <div id="import-alert" class="alert alert-error" role="alert" hidden></div>
    <div class="form-group">
      <label class="form-label" for="inp-csv">Pilih file CSV</label>
      <input type="file" id="inp-csv" accept=".csv" class="form-input">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" onclick="submitImportCsv()"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>Import file</button>
      <button type="button" class="btn btn-ghost" onclick="document.getElementById('modal-import').classList.remove('show')">Batal</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" aria-label="Navigasi utama">
    <div class="sidebar-logo">
      <img class="brand-mark" src="img/logo_salut.png" alt="">
      <div>
        <p class="brand-role" id="sidebar-role-label">Admin Panel</p>
        <span class="brand-sub">v1.0 • SMK 1 Teladan</span>
      </div>
    </div>
    <nav class="nav-section" id="sidebar-nav" aria-label="Menu"></nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <div class="user-name" id="nav-user-name">Memuat...</div>
          <div class="user-role" id="nav-user-role">peran</div>
        </div>
      </div>
      <button type="button" class="btn-logout" id="btn-logout"><svg class="icon" aria-hidden="true"><use href="#i-log-out"/></svg>Keluar</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 class="page-title">Siswa &amp; Alumni</h1><p class="page-sub">Manajemen akun pengguna SALUT</p></div>
      <div class="btn-group" id="topbar-actions">
        <button type="button" class="btn btn-ghost" onclick="exportAlumni()"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Export alumni (CSV)</button>
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('modal-import').classList.add('show')"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>Import CSV</button>
      </div>
    </header>
    <div class="content">
      <dl class="card kpi-list kpi-list--4" aria-label="Ringkasan pengguna">
        <div class="kpi"><dt class="kpi-label">Siswa aktif</dt><dd class="kpi-value" id="st-siswa" data-count>—</dd></div>
        <div class="kpi"><dt class="kpi-label">Alumni</dt><dd class="kpi-value" id="st-alumni" data-count>—</dd></div>
        <div class="kpi"><dt class="kpi-label">Guru</dt><dd class="kpi-value" id="st-guru" data-count>—</dd></div>
        <div class="kpi"><dt class="kpi-label">Total pengguna</dt><dd class="kpi-value" id="st-total" data-count>—</dd></div>
      </dl>
      <div class="toolbar">
        <div class="search-input-wrap"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input type="text" class="search-input" id="search" aria-label="Cari nama atau NISN" placeholder="Cari nama atau NISN..." oninput="applyFilters()"></div>
        <select class="form-input form-select" id="filter-role" aria-label="Filter role" onchange="applyFilters()">
          <option value="">Semua Role</option><option value="siswa">Siswa</option><option value="alumni">Alumni</option><option value="guru">Guru</option>
        </select>
        <select class="form-input form-select" id="filter-kelas" aria-label="Filter kelas" onchange="applyFilters()">
          <option value="">Semua Kelas</option>
          <optgroup label="Kelas X">
            <option value="X TKJ 1">X TKJ 1</option>
            <option value="X TKJ 2">X TKJ 2</option>
            <option value="X RPL 1">X RPL 1</option>
            <option value="X Multimedia 1">X Multimedia 1</option>
          </optgroup>
          <optgroup label="Kelas XI">
            <option value="XI TKJ 1">XI TKJ 1</option>
            <option value="XI TKJ 2">XI TKJ 2</option>
            <option value="XI RPL 1">XI RPL 1</option>
            <option value="XI Multimedia 1">XI Multimedia 1</option>
          </optgroup>
          <optgroup label="Kelas XII">
            <option value="XII TKJ 1">XII TKJ 1</option>
            <option value="XII TKJ 2">XII TKJ 2</option>
            <option value="XII RPL 1">XII RPL 1</option>
            <option value="XII Multimedia 1">XII Multimedia 1</option>
          </optgroup>
        </select>
        <select class="form-input form-select" id="filter-angkatan" aria-label="Filter angkatan" onchange="applyFilters()">
          <option value="">Semua Angkatan</option>
          <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option>
        </select>
      </div>
      <div id="table-content"></div>
      <div id="pagination" class="pagination"></div>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.12/dist/motion.js"></script>
<script src="js/motion.js"></script>
<script>
Auth.guard();
Auth.buildNav('students');
const currentUser = Auth.user();
const isAdmin = currentUser && currentUser.role === 'admin';

if (isAdmin) {
  document.getElementById('topbar-actions').insertAdjacentHTML('beforeend',
    '<button type="button" class="btn btn-primary" onclick="document.getElementById(\'modal-add\').classList.add(\'show\')">' + Icons.svg('plus', 16) + 'Tambah pengguna</button>'
  );
}

const roleLabel = { siswa: 'Siswa', alumni: 'Alumni', guru: 'Guru', admin: 'Admin' };
let currentPage = 1;

async function loadStats() {
  try {
    const res = await Api.get('/admin/stats');
    const d   = res.data;
    document.getElementById('st-siswa').textContent  = d.total_siswa;
    document.getElementById('st-alumni').textContent = d.total_alumni;
    document.getElementById('st-guru').textContent   = d.total_guru;
    document.getElementById('st-total').textContent  = d.total_siswa + d.total_alumni + d.total_guru;
  } catch(e) { console.warn('Stats gagal:', e.message); }
}

async function loadUsers(page) {
  page = page || 1;
  currentPage = page;
  document.getElementById('table-content').innerHTML = UI.loading();
  const role     = document.getElementById('filter-role').value;
  const kelas    = document.getElementById('filter-kelas').value;
  const angkatan = document.getElementById('filter-angkatan').value;
  const search   = document.getElementById('search').value.trim();
  const params   = new URLSearchParams({ per_page: 50, page: page });
  if (role)     params.set('role', role);
  if (kelas)    params.set('class_name', kelas);
  if (angkatan) params.set('angkatan', angkatan);
  if (search)   params.set('search', search);

  try {
    const res   = await Api.get('/admin/users?' + params.toString());
    const paged = res.data;
    renderUsers(paged.data);
    renderPagination(paged);
  } catch(e) {
    document.getElementById('table-content').innerHTML = UI.error(e.message, 'loadUsers(' + page + ')');
  }
}

function applyFilters() { loadUsers(1); }

function renderUsers(data) {
  if (!data || !data.length) {
    document.getElementById('table-content').innerHTML = UI.empty('Tidak ada pengguna yang cocok', 'Ubah filter atau kata kunci pencarian.', 'users');
    return;
  }
  var rows = data.map(function(u) {
    var aksi = '';
    if (isAdmin && u.role === 'siswa') {
      aksi = '<button type="button" class="btn btn-ghost btn-sm" onclick="promoteAlumni(' + u.id + ',\'' + UI.esc(u.name.replace(/'/g, "\\'")) + '\')">' + Icons.svg('graduation', 16) + 'Promosikan ke alumni</button>';
    } else {
      aksi = '<span class="text-muted">—</span>';
    }
    var status = u.is_active
      ? '<span class="badge badge-success">' + Icons.svg('check-circle', 12) + 'Aktif</span>'
      : '<span class="badge badge-danger">' + Icons.svg('x-circle', 12) + 'Nonaktif</span>';
    return '<tr>' +
      '<td><div class="cell-person"><div class="avatar-sm" aria-hidden="true">' + UI.esc(u.name.charAt(0)) + '</div><div><div class="cell-name">' + UI.esc(u.name) + '</div><div class="cell-sub mono">NISN ' + UI.esc(u.nisn) + '</div></div></div></td>' +
      '<td><span class="badge badge-' + UI.esc(u.role) + '">' + UI.esc(roleLabel[u.role] || u.role) + '</span></td>' +
      '<td>' + UI.esc(u.class_name || '—') + '</td>' +
      '<td class="num">' + UI.esc(u.angkatan || '—') + '</td>' +
      '<td>' + status + '</td>' +
      '<td>' + aksi + '</td>' +
      '</tr>';
  }).join('');
  document.getElementById('table-content').innerHTML =
    '<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Role</th><th>Kelas</th><th class="num">Angkatan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderPagination(meta) {
  var el = document.getElementById('pagination');
  if (!meta || meta.last_page <= 1) { el.innerHTML = ''; return; }
  var html = '';
  for (var p = 1; p <= meta.last_page; p++) {
    var current = p === meta.current_page;
    html += '<button type="button" class="btn btn-ghost btn-sm' + (current ? ' is-current' : '') + '"' + (current ? ' aria-current="page"' : '') + ' aria-label="Halaman ' + p + '" onclick="loadUsers(' + p + ')">' + p + '</button>';
  }
  el.innerHTML = html;
}

async function promoteAlumni(id, name) {
  if (!confirm('Promosikan ' + name + ' menjadi Alumni? Tindakan ini tidak bisa dibatalkan.')) return;
  try {
    await Api.patch('/admin/users/' + id + '/promote');
    toast(name + ' berhasil dipromosikan menjadi Alumni.', 'success');
    loadStats(); loadUsers(currentPage);
  } catch(e) { toast(e.message || 'Gagal promosi.', 'error'); }
}

async function exportAlumni() {
  try {
    toast('Menyiapkan file CSV...', 'info');
    var token = localStorage.getItem('salut_token');
    var res = await fetch(API_BASE + '/admin/alumni/export', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('Gagal export (hanya Admin yang diizinkan)');
    var blob = await res.blob();
    var url  = window.URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = 'Data_Alumni_SALUT_' + new Date().toISOString().split('T')[0] + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Berhasil download data alumni!', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

function toggleFields() {
  var role = document.getElementById('inp-role').value;
  var show = role === 'siswa' || role === 'alumni';
  document.querySelectorAll('.student-field').forEach(function(el) { el.style.display = show ? '' : 'none'; });
}

async function submitAdd() {
  var data = {
    name:       document.getElementById('inp-name').value.trim(),
    nisn:       document.getElementById('inp-nisn').value.trim(),
    email:      document.getElementById('inp-email').value.trim() || null,
    phone:      document.getElementById('inp-phone').value.trim() || null,
    role:       document.getElementById('inp-role').value,
    password:   document.getElementById('inp-pass').value,
    class_name: document.getElementById('inp-class').value || null,
    angkatan:   document.getElementById('inp-angkatan').value.trim() || null,
  };
  var alertEl = document.getElementById('add-alert');
  alertEl.style.display = 'none';
  if (!data.name || !data.nisn || !data.password) {
    alertEl.textContent = 'Nama, NISN, dan password wajib diisi.';
    alertEl.style.display = 'block'; return;
  }
  try {
    await Api.post('/admin/users', data);
    toast('Akun ' + data.name + ' berhasil dibuat.', 'success');
    document.getElementById('modal-add').classList.remove('show');
    loadStats(); loadUsers(1);
  } catch(e) { alertEl.textContent = e.message || 'Gagal membuat akun.'; alertEl.style.display = 'block'; }
}

async function submitImportCsv() {
  const fileInput = document.getElementById('inp-csv');
  if (!fileInput.files || fileInput.files.length === 0) {
    return toast('Pilih file CSV terlebih dahulu.', 'error');
  }
  const file = fileInput.files[0];
  const formData = new FormData();
  formData.append('file', file);

  try {
    const token = localStorage.getItem('salut_token');
    const res = await fetch(API_BASE + '/admin/users/import-csv', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: formData
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.message || 'Gagal import file');

    document.getElementById('modal-import').classList.remove('show');
    toast(json.message || 'Import berhasil!', 'success');
    fileInput.value = '';
    loadStats(); loadUsers(currentPage);
  } catch(e) {
    document.getElementById('import-alert').textContent = e.message;
    document.getElementById('import-alert').style.display = 'block';
  }
}

loadStats(); loadUsers(1);
</script>
</body>
</html>
