<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen Siswa — SALUT Admin</title>
<meta name="description" content="Manajemen data siswa dan alumni SALUT">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toast-container"></div>
<!-- Modal Tambah Siswa (Admin only) -->
<div class="modal-overlay" id="modal-add">
  <div class="modal" style="max-width:560px;">
    <div class="modal-title">Tambah Pengguna Baru</div>
    <div class="modal-sub">Daftarkan akun siswa, alumni, atau guru baru</div>
    <div id="add-alert" class="alert alert-error" style="display:none"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="form-group" style="margin:0"><label class="form-label">Nama Lengkap</label><input id="inp-name" class="form-input" placeholder="Nama lengkap"></div>
      <div class="form-group" style="margin:0"><label class="form-label">NISN (10 digit)</label><input id="inp-nisn" class="form-input" placeholder="0000000000" maxlength="10"></div>
      <div class="form-group" style="margin:0"><label class="form-label">Email (opsional)</label><input id="inp-email" class="form-input" type="email" placeholder="email@example.com"></div>
      <div class="form-group" style="margin:0"><label class="form-label">No. HP</label><input id="inp-phone" class="form-input" placeholder="+62..."></div>
      <div class="form-group" style="margin:0"><label class="form-label">Role</label>
        <select id="inp-role" class="form-input form-select" onchange="toggleFields()">
          <option value="siswa">Siswa Aktif</option>
          <option value="alumni">Alumni</option>
          <option value="guru">Guru</option>
        </select>
      </div>
      <div class="form-group" style="margin:0"><label class="form-label">Password</label><input id="inp-pass" class="form-input" type="password" placeholder="Min. 6 karakter"></div>
      <div class="form-group student-field" style="margin:0"><label class="form-label">Kelas</label>
        <select id="inp-class" class="form-input form-select">
          <option value="">-- Pilih Kelas --</option>
          <optgroup label="Kelas X"><option>X IPA 1</option><option>X IPA 2</option><option>X IPS 1</option><option>X IPS 2</option></optgroup>
          <optgroup label="Kelas XI"><option>XI IPA 1</option><option>XI IPA 2</option><option>XI IPS 1</option><option>XI IPS 2</option></optgroup>
          <optgroup label="Kelas XII"><option>XII IPA 1</option><option>XII IPA 2</option><option>XII IPS 1</option><option>XII IPS 2</option></optgroup>
        </select>
      </div>
      <div class="form-group student-field" style="margin:0"><label class="form-label">Angkatan</label><input id="inp-angkatan" class="form-input" placeholder="2026" maxlength="4"></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:20px;">
      <button class="btn btn-primary" style="flex:1;" onclick="submitAdd()">✅ Simpan</button>
      <button class="btn btn-ghost" onclick="document.getElementById('modal-add').classList.remove('show')">Batal</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><h1><span>SALUT</span></h1><p id="sidebar-role-label">Panel v1.0</p></div>
    <nav class="nav-section" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-card"><div class="user-avatar" id="user-avatar">A</div><div><div class="user-name" id="nav-user-name">Loading...</div><div class="user-role" id="nav-user-role">role</div></div></div>
      <button class="btn-logout" id="btn-logout">🚪 Keluar</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><div class="page-title">Siswa &amp; Alumni</div><div class="page-sub">Manajemen akun pengguna SALUT</div></div>
      <div style="display:flex;gap:10px;" id="topbar-actions">
        <button class="btn btn-ghost" onclick="exportAlumni()" style="border:1px solid var(--border)">📊 Export Alumni CSV</button>
      </div>
    </div>
    <div class="content">
      <!-- Stat ringkas -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;">
        <div class="card" style="padding:16px;text-align:center"><div style="font-size:24px;font-weight:800;color:#6366F1" id="st-siswa">—</div><div style="font-size:12px;color:var(--muted)">Siswa Aktif</div></div>
        <div class="card" style="padding:16px;text-align:center"><div style="font-size:24px;font-weight:800;color:#06B6D4" id="st-alumni">—</div><div style="font-size:12px;color:var(--muted)">Alumni</div></div>
        <div class="card" style="padding:16px;text-align:center"><div style="font-size:24px;font-weight:800;color:#F59E0B" id="st-guru">—</div><div style="font-size:12px;color:var(--muted)">Guru</div></div>
        <div class="card" style="padding:16px;text-align:center"><div style="font-size:24px;font-weight:800;color:#10B981" id="st-total">—</div><div style="font-size:12px;color:var(--muted)">Total</div></div>
      </div>
      <div class="toolbar">
        <div class="search-input-wrap"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/></svg><input type="text" class="search-input" id="search" placeholder="Cari nama atau NISN..." oninput="applyFilters()"></div>
        <select class="form-input form-select" id="filter-role" style="width:145px;" onchange="applyFilters()">
          <option value="">Semua Role</option><option value="siswa">Siswa</option><option value="alumni">Alumni</option><option value="guru">Guru</option>
        </select>
        <select class="form-input form-select" id="filter-kelas" style="width:145px;" onchange="applyFilters()">
          <option value="">Semua Kelas</option>
          <optgroup label="Kelas X"><option value="X IPA 1">X IPA 1</option><option value="X IPA 2">X IPA 2</option><option value="X IPS 1">X IPS 1</option><option value="X IPS 2">X IPS 2</option></optgroup>
          <optgroup label="Kelas XI"><option value="XI IPA 1">XI IPA 1</option><option value="XI IPA 2">XI IPA 2</option><option value="XI IPS 1">XI IPS 1</option><option value="XI IPS 2">XI IPS 2</option></optgroup>
          <optgroup label="Kelas XII"><option value="XII IPA 1">XII IPA 1</option><option value="XII IPA 2">XII IPA 2</option><option value="XII IPS 1">XII IPS 1</option><option value="XII IPS 2">XII IPS 2</option></optgroup>
        </select>
        <select class="form-input form-select" id="filter-angkatan" style="width:140px;" onchange="applyFilters()">
          <option value="">Semua Angkatan</option>
          <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option>
        </select>
      </div>
      <div id="table-content"><div class="loading"><div class="spinner"></div>Memuat data pengguna...</div></div>
      <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;"></div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
Auth.guard();
Auth.buildNav('students');
const currentUser = Auth.user();
const isAdmin = currentUser && currentUser.role === 'admin';

if (isAdmin) {
  document.getElementById('topbar-actions').insertAdjacentHTML('beforeend',
    '<button class="btn btn-primary" onclick="document.getElementById(\'modal-add\').classList.add(\'show\')">➕ Tambah Pengguna</button>'
  );
}

let currentPage = 1;

async function loadStats() {
  try {
    const res = await Api.get('/admin/stats');
    const d   = res.data;
    document.getElementById('st-siswa').textContent  = d.total_siswa;
    document.getElementById('st-alumni').textContent = d.total_alumni;
    document.getElementById('st-guru').textContent   = d.total_guru;
    document.getElementById('st-total').textContent  = d.total_siswa + d.total_alumni + d.total_guru;
  } catch(e) { console.warn('Stats gagal:', e.message); }
}

async function loadUsers(page) {
  page = page || 1;
  currentPage = page;
  document.getElementById('table-content').innerHTML = '<div class="loading"><div class="spinner"></div>Memuat...</div>';
  const role     = document.getElementById('filter-role').value;
  const kelas    = document.getElementById('filter-kelas').value;
  const angkatan = document.getElementById('filter-angkatan').value;
  const search   = document.getElementById('search').value.trim();
  const params   = new URLSearchParams({ per_page: 50, page: page });
  if (role)     params.set('role', role);
  if (kelas)    params.set('class_name', kelas);
  if (angkatan) params.set('angkatan', angkatan);
  if (search)   params.set('search', search);

  try {
    const res   = await Api.get('/admin/users?' + params.toString());
    const paged = res.data;
    renderUsers(paged.data);
    renderPagination(paged);
  } catch(e) {
    document.getElementById('table-content').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Gagal memuat data</div><div class="empty-sub">' + e.message + '</div></div>';
  }
}

function applyFilters() { loadUsers(1); }

function renderUsers(data) {
  if (!data || !data.length) {
    document.getElementById('table-content').innerHTML = '<div class="empty"><div class="empty-icon">👤</div><div class="empty-title">Tidak ada data pengguna</div></div>';
    return;
  }
  var rows = data.map(function(u) {
    var aksi = '';
    if (isAdmin && u.role === 'siswa') {
      aksi = '<button class="btn btn-ghost btn-sm" onclick="promoteAlumni(' + u.id + ',\'' + u.name.replace(/'/g, "\\'") + '\')">🎓 Promosi Alumni</button>';
    } else {
      aksi = '<span style="color:var(--muted);font-size:12px;">—</span>';
    }
    return '<tr>' +
      '<td><div style="display:flex;align-items:center;gap:10px;"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#06B6D4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;">' + u.name.charAt(0) + '</div><div><div style="font-weight:600;font-size:13px;">' + u.name + '</div><div style="font-size:11px;color:var(--muted)">NISN: ' + u.nisn + '</div></div></div></td>' +
      '<td><span class="badge badge-' + u.role + '">' + u.role + '</span></td>' +
      '<td style="font-size:13px;">' + (u.class_name || '—') + '</td>' +
      '<td style="font-size:13px;">' + (u.angkatan || '—') + '</td>' +
      '<td><span style="font-size:12px;font-weight:600;color:' + (u.is_active ? '#34D399' : '#FCA5A5') + '">' + (u.is_active ? '✅ Aktif' : '❌ Nonaktif') + '</span></td>' +
      '<td>' + aksi + '</td>' +
      '</tr>';
  }).join('');
  document.getElementById('table-content').innerHTML =
    '<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Role</th><th>Kelas</th><th>Angkatan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderPagination(meta) {
  var el = document.getElementById('pagination');
  if (!meta || meta.last_page <= 1) { el.innerHTML = ''; return; }
  var html = '';
  for (var p = 1; p <= meta.last_page; p++) {
    var style = p === meta.current_page ? 'background:rgba(99,102,241,0.2);color:#A5B4FC;' : '';
    html += '<button class="btn btn-ghost btn-sm" style="' + style + '" onclick="loadUsers(' + p + ')">' + p + '</button>';
  }
  el.innerHTML = html;
}

async function promoteAlumni(id, name) {
  if (!confirm('Promosikan ' + name + ' menjadi Alumni? Tindakan ini tidak bisa dibatalkan.')) return;
  try {
    await Api.patch('/admin/users/' + id + '/promote');
    toast(name + ' berhasil dipromosikan menjadi Alumni! 🎓', 'success');
    loadStats(); loadUsers(currentPage);
  } catch(e) { toast(e.message || 'Gagal promosi.', 'error'); }
}

async function exportAlumni() {
  try {
    toast('Menyiapkan file CSV...', 'info');
    var token = localStorage.getItem('salut_token');
    var res = await fetch('http://127.0.0.1:8000/api/alumni/export', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('Gagal export (hanya Admin yang diizinkan)');
    var blob = await res.blob();
    var url  = window.URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = 'Data_Alumni_SALUT_' + new Date().toISOString().split('T')[0] + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Berhasil download data alumni!', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

function toggleFields() {
  var role = document.getElementById('inp-role').value;
  var show = role === 'siswa' || role === 'alumni';
  document.querySelectorAll('.student-field').forEach(function(el) { el.style.display = show ? '' : 'none'; });
}

async function submitAdd() {
  var data = {
    name:       document.getElementById('inp-name').value.trim(),
    nisn:       document.getElementById('inp-nisn').value.trim(),
    email:      document.getElementById('inp-email').value.trim() || null,
    phone:      document.getElementById('inp-phone').value.trim() || null,
    role:       document.getElementById('inp-role').value,
    password:   document.getElementById('inp-pass').value,
    class_name: document.getElementById('inp-class').value || null,
    angkatan:   document.getElementById('inp-angkatan').value.trim() || null,
  };
  var alertEl = document.getElementById('add-alert');
  alertEl.style.display = 'none';
  if (!data.name || !data.nisn || !data.password) {
    alertEl.textContent = 'Nama, NISN, dan password wajib diisi.';
    alertEl.style.display = 'block'; return;
  }
  try {
    await Api.post('/admin/users', data);
    toast('Akun ' + data.name + ' berhasil dibuat! ✅', 'success');
    document.getElementById('modal-add').classList.remove('show');
    loadStats(); loadUsers(1);
  } catch(e) { alertEl.textContent = e.message || 'Gagal membuat akun.'; alertEl.style.display = 'block'; }
}

function toast(msg, type) {
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.innerHTML = (type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️') + ' ' + msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(function() { el.remove(); }, 4000);
}

loadStats(); loadUsers(1);
</script>
</body>
</html>
